[build-system]
requires = ["setuptools>=80.0.0,<81", "wheel>=0.45.0,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-android"
version = "0.1.0"
description = "Android embedded runtime for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13,<4"
dependencies = [
    "aiohttp>=3.9.5,<4",
    "android-chaquopy>=17.0.0,<18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "pytest-cov>=6.0.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hermes_android*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]